name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: kivy/buildozer:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          tar -xzf global_rat.tar.gz
          cd global_rat

      - name: Build APK
        run: |
          cd global_rat
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: global_rat_apk
          path: global_rat/bin/*.apk
