name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          tar -xzf global_rat.tar.gz
          cd global_rat

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Java 17 — строго обязателен для новых версий SDK
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем Android SDK через официальный экшен
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Устанавливаем build-tools (именно там лежит нужный aidl)
      # Версия 34.0.0 актуальна на 2026 год и содержит aidl
      - name: Install build-tools with aidl
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Добавляем путь к build-tools в PATH, чтобы Buildozer нашел aidl
      - name: Add build-tools to PATH
        run: echo "$ANDROID_SDK_ROOT/build-tools/34.0.0" >> $GITHUB_PATH

      # Проверяем, что aidl теперь доступен
      - name: Verify aidl
        run: |
          which aidl
          aidl --version || echo "aidl found (version command may vary)"

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build APK
        run: |
          cd global_rat
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: global_rat_apk
          path: global_rat/bin/*.apk
