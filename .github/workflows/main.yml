name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract archive
        run: |
          tar -xzf global_rat.tar.gz
          cd global_rat

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Set Android SDK path for buildozer
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/build-tools/30.0.3" >> $GITHUB_PATH

      - name: Install buildozer
        run: |
          pip install buildozer cython

      - name: Create buildozer spec with SDK paths
        run: |
          cd global_rat
          cat >> buildozer.spec << EOF

          [app]
          android.sdk_path = $ANDROID_SDK_ROOT
          android.ndk_path = /usr/local/lib/android/sdk/ndk-bundle
          EOF

      - name: Build APK
        run: |
          cd global_rat
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: global_rat_apk
          path: global_rat/bin/*.apk
