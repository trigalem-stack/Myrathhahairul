name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip archive
        run: |
          unzip -q global_rat.zip
          ls -la global_rat/

      - name: Build APK
        run: |
          cd global_rat
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: global_rat_apk
          path: global_rat/bin/*.apk
